# Local Supabase stack settings only. This project is not linked to a remote.
project_id = "evidence-layer-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback?next=%2F",
  "http://127.0.0.1:3000/auth/callback?next=%2Freset-password",
]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_confirmations = true
max_frequency = "1s"

[auth.rate_limit]
email_sent = 100
