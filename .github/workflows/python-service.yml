name: Python service checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/python-health-service]

permissions:
  contents: read

jobs:
  auth-ui-browser:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_ui_only
      EVIDENCE_SERVICE_URL: http://127.0.0.1:54322
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium and operating-system dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run authentication browser tests against local fixtures
        working-directory: apps/web
        run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Test, typecheck, and lint web app
        working-directory: apps/web
        run: npm test && npm run typecheck && npm run lint
      - name: Build web app
        working-directory: apps/web
        run: npm run build

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core, test, and service dependencies
        run: python -m pip install -e ".[dev,service]"
      - name: Materialize deterministic Real-World v1 split fixtures
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/verify_real_world_benchmark.py --write-manifest
          git diff --exit-code -- data/real_world/verification_manifest.json reports/phase6_real_world_lexical.json
      - name: Run focused service tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider tests/test_evidence_service_health.py tests/test_evidence_service_auth.py tests/test_evidence_service_config.py tests/test_evidence_service_repository.py
      - name: Run full test suite
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider
      - name: Build service image without publishing
        run: docker build -f services/evidence-service/Dockerfile -t evidence-service:ci .

  live-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core, test, and service dependencies
        run: python -m pip install -e ".[dev,service]"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Run live Supabase integration tests on a disposable isolated stack
        run: PYTHONDONTWRITEBYTECODE=1 python tests/integration/run_local_supabase.py

  workspace-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start the local Supabase stack
        run: supabase start
      - name: Apply migrations to the local database
        run: supabase db reset --local
      - name: Run Postgres RLS integration tests
        run: supabase test db --local
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run local Auth and database integration test
        working-directory: apps/web
        run: npm run test:integration:local
      - name: Stop the local Supabase stack
        if: always()
        run: supabase stop --no-backup
